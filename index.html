<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Chronicle — Premium WordPress News Blog</title>
    <meta name="description" content="A premium editorial WordPress-inspired news blog with magazine styling, responsive layout, cache telemetry, and a polished publishing experience for modern digital media brands." />
    
    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Chronicle — Premium WordPress News Blog" />
    <meta property="og:description" content="A premium editorial WordPress-inspired news blog with magazine styling, responsive layout, cache telemetry, and a polished publishing experience for modern digital media brands." />
    <meta property="og:site_name" content="The Chronicle" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Chronicle — Premium WordPress News Blog" />
    <meta name="twitter:description" content="A premium editorial WordPress-inspired news blog with magazine styling, responsive layout, cache telemetry, and a polished publishing experience for modern digital media brands." />

    <!-- Editorial Fonts: Newsreader for serif editorial headlines & body, Plus Jakarta Sans for clean UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Blog",
      "name": "Custom WordPress Blog",
      "description": "A high-performance custom blog powered by WordPress architecture, MySQL schema, and multi-tier edge caching for high traffic efficiency.",
      "publisher": {
        "@type": "Organization",
        "name": "Custom WordPress Blog Publishing"
      }
    }
    </script>
  </head>
  <body class="bg-[#faf9f6] text-[#1c1917] antialiased selection:bg-[#1c1917] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
